<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10101c">
<meta name="description" content="Yofista - Share photos, reels and videos.">
<title>Yofista — Share Your World</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#10101c;color:#fff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
header{height:62px;position:sticky;top:0;z-index:5;background:#171725;
display:flex;align-items:center;justify-content:space-between;padding:0 16px;
border-bottom:1px solid #303044}
.logo{font-size:26px;font-weight:900;color:#d9bd76}
.wrap{max-width:700px;margin:auto;padding:16px 14px 95px}
.sub{color:#aaa;line-height:1.5}
.btn{background:#29293d;color:#fff;border:1px solid #41415a;border-radius:10px;padding:11px 14px}
.gold{background:#d9bd76;color:#171321;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}
.full{width:100%}
.tabs{display:flex;gap:8px;margin:16px 0;overflow:auto}
.tabs button{white-space:nowrap;flex:1}
.tabs .active{background:#d9bd76;color:#171321;border-color:#d9bd76}
.card{background:#1b1b2c;border:1px solid #343449;border-radius:15px;padding:14px;margin:14px 0}
.row{display:flex;align-items:center;gap:10px}
.avatar{height:40px;width:40px;border-radius:50%;background:#d9bd76;color:#171321;
display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.grow{flex:1;min-width:0}
.media{width:100%;max-height:70vh;object-fit:contain;background:#08080d;border-radius:10px;margin-top:12px}
.caption{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;min-width:75px}
input,textarea{width:100%;background:#11111e;color:white;border:1px solid #44445c;
border-radius:10px;padding:12px;margin:6px 0 12px}
textarea{resize:vertical;min-height:75px}
label{display:block;font-size:14px;color:#c8c8d5}
.hidden{display:none!important}
#notice{padding:10px 14px;border-radius:10px;background:#25253a;margin:12px 0;display:none;overflow-wrap:anywhere}
#notice.error{background:#50242c}
#authBox{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}
.panel{background:#1b1b2c;border:1px solid #45455d;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.panel h2{margin-top:0}
.empty{text-align:center;padding:35px 10px;color:#aaa}
footer{position:fixed;bottom:0;left:0;right:0;background:#171725;border-top:1px solid #303044;
display:flex;justify-content:center;gap:5px;padding:9px;z-index:6}
footer button{flex:1;max-width:140px;background:transparent;border:0;color:#ddd;padding:9px 2px;font-size:12px}
footer button span{display:block;font-size:19px;margin-bottom:4px}
.small{font-size:12px;color:#aaa}
#uploadBox{scroll-margin-top:80px}
</style>
</head>

<body>
<header>
  <div class="logo">YOFISTA ✦</div>
  <button id="authButton" class="gold" onclick="openAuth()">Log in / Join</button>
</header>

<div class="wrap">
  <div id="notice" role="status"></div>

  <section>
    <h2 style="margin-bottom:4px">Share your world.</h2>
    <div class="sub">Photos, Reels, videos and people you love — all in one place.</div>
    <div class="tabs">
      <button class="btn active" data-tab="all" onclick="setTab('all')">For You</button>
      <button class="btn" data-tab="video" onclick="setTab('video')">Reels / Videos</button>
      <button class="btn" data-tab="image" onclick="setTab('image')">Photos</button>
    </div>
  </section>

  <section id="uploadBox" class="card hidden">
    <h3 style="margin-top:0">＋ Create a post</h3>
    <form id="uploadForm">
      <label for="mediaFile">Photo or video</label>
      <input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime" required>
      <label for="caption">Write a caption</label>
      <textarea id="caption" maxlength="2000" placeholder="What would you like to share?"></textarea>
      <div class="small">Maximum file size: 50 MB.</div>
      <button id="uploadButton" class="gold full" type="submit">Upload post</button>
    </form>
  </section>

  <section id="feed">
    <div class="empty">Loading Yofista…</div>
  </section>

  <section id="profileBox" class="hidden">
    <div class="card">
      <h2>Your profile</h2>
      <div id="profileInfo" class="sub"></div>
      <button class="btn" onclick="logout()">Log out</button>
    </div>
    <h3>Your posts</h3>
    <div id="myPosts"></div>
  </section>
</div>

<footer>
  <button onclick="goHome()"><span>⌂</span>Home</button>
  <button onclick="setTab('video');goHome()"><span>▶</span>Reels</button>
  <button onclick="startUpload()"><span>＋</span>Create</button>
  <button onclick="openProfile()"><span>◉</span>Profile</button>
</footer>

<div id="authBox">
  <div class="panel">
    <button class="btn" style="float:right" onclick="closeAuth()">✕</button>
    <h2>Welcome to Yofista</h2>
    <p class="sub">Login or create an account to upload, like and comment.</p>

    <div class="tabs">
      <button id="loginTab" class="btn active" onclick="authMode('login')">Login</button>
      <button id="signupTab" class="btn" onclick="authMode('signup')">Sign up</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Your name</label>
        <input id="fullName" maxlength="60" autocomplete="name" placeholder="Enter your name">
      </div>
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters">
      <button id="authSubmit" class="gold full" type="submit">Log in</button>
    </form>
    <p class="small">Never share your password with anyone.</p>
  </div>
</div>

<script>
/* YOFISTA SUPABASE CONFIGURATION */
const SUPABASE_URL = "https://maodvbkebhrvztevuwwd.supabase.co";
const SUPABASE_KEY = "sb_publishable_nrrWCiZxC8oCzoeFfmUc6A_xQ-Yxd2c";
const BUCKET = "yofista-media";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentTab = "all";
let authModeValue = "login";
let posts = [];
let profileMode = false;
let busy = false;

const $ = id => document.getElementById(id);

function notify(message, error=false) {
  const el = $("notice");
  el.textContent = message;
  el.className = error ? "error" : "";
  el.style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
}
function clearNotice() {
  $("notice").style.display = "none";
}
function escapeHTML(value="") {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}
function displayName(user) {
  return user?.user_metadata?.full_name || user?.email?.split("@")[0] || "Yofista User";
}
function initials(name) {
  return (name || "Y").trim().slice(0,1).toUpperCase();
}
function dateText(date) {
  return new Date(date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
}
function openAuth() {
  if (currentUser) { openProfile(); return; }
  $("authBox").style.display = "flex";
}
function closeAuth() { $("authBox").style.display = "none"; }
function authMode(mode) {
  authModeValue = mode;
  $("nameField").classList.toggle("hidden", mode !== "signup");
  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", mode === "signup");
  $("authSubmit").textContent = mode === "login" ? "Log in" : "Create account";
  $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
}
function setTab(tab) {
  currentTab = tab;
  profileMode = false;
  $("profileBox").classList.add("hidden");
  $("feed").classList.remove("hidden");
  $("uploadBox").classList.toggle("hidden", !currentUser);
  document.querySelectorAll("[data-tab]").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab)
  );
  renderFeed();
}
function goHome() {
  profileMode = false;
  $("profileBox").classList.add("hidden");
  $("feed").classList.remove("hidden");
  setTab(currentTab);
  window.scrollTo({top:0,behavior:"smooth"});
}
function startUpload() {
  if (!currentUser) { notify("Upload karne ke liye pehle login karo."); openAuth(); return; }
  goHome();
  $("uploadBox").classList.remove("hidden");
  $("uploadBox").scrollIntoView({behavior:"smooth"});
  $("mediaFile").focus();
}
function openProfile() {
  if (!currentUser) { notify("Profile dekhne ke liye login karo."); openAuth(); return; }
  profileMode = true;
  $("feed").classList.add("hidden");
  $("uploadBox").classList.add("hidden");
  $("profileBox").classList.remove("hidden");
  $("profileInfo").textContent = displayName(currentUser) + " · " + currentUser.email;
  const mine = posts.filter(p => p.user_id === currentUser.id);
  $("myPosts").innerHTML = mine.length ? mine.map(renderPost).join("") :
    '<div class="empty">You have not shared any posts yet.</div>';
  window.scrollTo({top:0,behavior:"smooth"});
}
function syncUI() {
  $("authButton").textContent = currentUser ? "My account" : "Log in / Join";
  $("uploadBox").classList.toggle("hidden", !currentUser || profileMode);
  if (profileMode && !currentUser) goHome();
}
async function logout() {
  const {error} = await db.auth.signOut();
  if (error) return notify(error.message,true);
  currentUser = null;
  profileMode = false;
  syncUI();
  goHome();
  notify("You have logged out.");
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  clearNotice();
  const email = $("email").value.trim();
  const password = $("password").value;
  const name = $("fullName").value.trim();

  $("authSubmit").disabled = true;
  try {
    if (authModeValue === "signup") {
      const {data,error} = await db.auth.signUp({
        email,password,
        options:{data:{full_name:name || email.split("@")[0]}}
      });
      if (error) throw error;
      if (data.session) {
        currentUser = data.user;
        closeAuth();
        syncUI();
        await loadFeed();
        notify("Account created successfully!");
      } else {
        notify("Account request successful. Check your email for confirmation, then log in.");
        authMode("login");
      }
    } else {
      const {data,error} = await db.auth.signInWithPassword({email,password});
      if (error) throw error;
      currentUser = data.user;
      closeAuth();
      syncUI();
      await loadFeed();
      notify("Welcome back to Yofista!");
    }
  } catch(err) {
    notify(err.message || "Login failed.",true);
  } finally {
    $("authSubmit").disabled = false;
  }
});

async function loadFeed() {
  $("feed").innerHTML = '<div class="empty">Loading posts…</div>';
  const {data,error} = await db.from("yofista_posts")
    .select("*").order("created_at",{ascending:false}).limit(100);
  if (error) {
    $("feed").innerHTML = '<div class="empty">Could not load posts.</div>';
    notify("Feed error: " + error.message,true);
    return;
  }

  posts = data || [];
  const ids = posts.map(p => p.id);
  if (ids.length) {
    const {data:likes,error:likeError} = await db.from("yofista_likes")
      .select("post_id,user_id").in("post_id",ids);
    if (!likeError) {
      const countMap = {};
      const mine = new Set();
      (likes || []).forEach(l => {
        countMap[l.post_id] = (countMap[l.post_id] || 0) + 1;
        if (currentUser && l.user_id === currentUser.id) mine.add(l.post_id);
      });
      posts.forEach(p => {
        p.likeCount = countMap[p.id] || 0;
        p.liked = mine.has(p.id);
      });
    }
  }
  renderFeed();
  if (profileMode) openProfile();
}

function renderPost(p) {
  const name = escapeHTML(p.author_name || "Yofista User");
  const caption = escapeHTML(p.caption || "");
  const url = escapeHTML(p.media_url || "");
  const isVideo = p.media_type === "video";
  const media = isVideo
    ? `<video class="media" src="${url}" controls playsinline preload="metadata"></video>`
    : `<img class="media" src="${url}" alt="Yofista post" loading="lazy">`;

  return `<article class="card" data-post="${escapeHTML(p.id)}">
    <div class="row">
      <div class="avatar">${escapeHTML(initials(name))}</div>
      <div class="grow"><b>${name}</b><div class="small">${dateText(p.created_at)}</div></div>
      ${isVideo ? '<span class="small">▶ VIDEO</span>' : '<span class="small">PHOTO</span>'}
    </div>
    ${caption ? `<p class="caption">${caption}</p>` : ""}
    ${media}
    <div class="actions">
      <button class="btn" onclick="toggleLike('${escapeHTML(p.id)}')">${p.liked ? "♥" : "♡"} Like (${p.likeCount || 0})</button>
      <button class="btn" onclick="showComments('${escapeHTML(p.id)}')">💬 Comment</button>
      <button class="btn" onclick="sharePost('${escapeHTML(p.id)}')">↗ Share</button>
      ${currentUser && currentUser.id === p.user_id ? `<button class="btn" onclick="deletePost('${escapeHTML(p.id)}')">Delete</button>` : ""}
    </div>
    <div id="comments-${escapeHTML(p.id)}"></div>
  </article>`;
}

function renderFeed() {
  if (profileMode) return;
  const visible = posts.filter(p => currentTab === "all" ||
    (currentTab === "video" && p.media_type === "video") ||
    (currentTab === "image" && p.media_type === "image"));
  $("feed").innerHTML = visible.length
    ? visible.map(renderPost).join("")
    : '<div class="card empty">No posts here yet.<br>Be the first to share something!</div>';
}

$("uploadForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!currentUser) { openAuth(); return; }
  if (busy) return;
  clearNotice();

  const file = $("mediaFile").files[0];
  const caption = $("caption").value.trim();
  if (!file) return notify("Choose a photo or video first.",true);
  if (file.size > 50 * 1024 * 1024) return notify("File must be 50 MB or smaller.",true);

  const allowed = ["image/jpeg","image/png","image/webp","video/mp4","video/webm","video/quicktime"];
  if (!allowed.includes(file.type)) return notify("Use JPG, PNG, WEBP, MP4, WEBM or MOV.",true);

  const mediaType = file.type.startsWith("video/") ? "video" : "image";
  const ext = (file.name.split(".").pop() || (mediaType === "video" ? "mp4" : "jpg"))
    .toLowerCase().replace(/[^a-z0-9]/g,"");
  const path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;

  busy = true;
  $("uploadButton").disabled = true;
  $("uploadButton").textContent = "Uploading…";

  try {
    const {error:uploadError} = await db.storage.from(BUCKET).upload(path,file,{
      contentType:file.type,
      upsert:false
    });
    if (uploadError) throw uploadError;

    const {data:urlData} = db.storage.from(BUCKET).getPublicUrl(path);
    const {error:postError} = await db.from("yofista_posts").insert({
      user_id:currentUser.id,
      caption,
      media_url:urlData.publicUrl,
      media_type:mediaType
    });

    if (postError) {
      await db.storage.from(BUCKET).remove([path]);
      throw postError;
    }

    $("uploadForm").reset();
    currentTab = "all";
    await loadFeed();
    notify("Your post is live on Yofista!");
    window.scrollTo({top:0,behavior:"smooth"});
  } catch(err) {
    notify("Upload failed: " + (err.message || "Please try again."),true);
  } finally {
    busy = false;
    $("uploadButton").disabled = false;
    $("uploadButton").textContent = "Upload post";
  }
});

async function toggleLike(postId) {
  if (!currentUser) { notify("Like karne ke liye login karo."); openAuth(); return; }
  const post = posts.find(p => p.id === postId);
  if (!post) return;
  const wasLiked = !!post.liked;
  post.liked = !wasLiked;
  post.likeCount = Math.max(0,(post.likeCount || 0) + (wasLiked ? -1 : 1));
  renderFeed();

  const result = wasLiked
    ? await db.from("yofista_likes").delete().eq("post_id",postId).eq("user_id",currentUser.id)
    : await db.from("yofista_likes").insert({post_id:postId,user_id:currentUser.id});

  if (result.error) {
    post.liked = wasLiked;
    post.likeCount = Math.max(0,(post.likeCount || 0) + (wasLiked ? 1 : -1));
    renderFeed();
    notify("Like failed: " + result.error.message,true);
  }
}

async function showComments(postId) {
  const box = $("comments-" + postId);
  if (!box) return;

  box.innerHTML = '<p class="small">Loading comments…</p>';
  const {data,error} = await db.from("yofista_comments")
    .select("id,user_id,comment,created_at").eq("post_id",postId)
    .order("created_at",{ascending:true}).limit(50);
  if (error) {
    box.innerHTML = "";
    return notify("Comments error: " + error.message,true);
  }

  const list = (data || []).map(c =>
    `<p class="caption"><b>${escapeHTML(c.user_id === currentUser?.id ? "You" : "User")}</b>: ${escapeHTML(c.comment)}</p>`
  ).join("");

  box.innerHTML = `<div class="card">
    <h4>Comments</h4>${list || '<p class="small">No comments yet.</p>'}
    <form onsubmit="addComment(event,'${escapeHTML(postId)}')">
      <textarea name="comment" maxlength="1000" required placeholder="Write a comment…"></textarea>
      <button class="gold" type="submit">Post comment</button>
    </form>
  </div>`;
}

async function addComment(e,postId) {
  e.preventDefault();
  if (!currentUser) { openAuth(); return; }
  const form = e.target;
  const comment = new FormData(form).get("comment").trim();
  if (!comment) return;

  const {error} = await db.from("yofista_comments").insert({
    post_id:postId,user_id:currentUser.id,comment
  });
  if (error) return notify("Comment failed: " + error.message,true);
  await showComments(postId);
}

async function sharePost(postId) {
  const post = posts.find(p => p.id === postId);
  if (!post) return;
  const shareData = {title:"Yofista",text:post.caption || "Check out this Yofista post!",url:post.media_url};
  try {
    if (navigator.share) await navigator.share(shareData);
    else if (navigator.clipboard) {
      await navigator.clipboard.writeText(post.media_url);
      notify("Post link copied!");
    } else {
      window.prompt("Copy this post URL:",post.media_url);
    }
  } catch(err) {
    if (err.name !== "AbortError") notify("Could not share this post.",true);
  }
}

async function deletePost(postId) {
  if (!currentUser || !confirm("Delete this post?")) return;
  const post = posts.find(p => p.id === postId);
  if (!post || post.user_id !== currentUser.id) return;

  const {error} = await db.from("yofista_posts").delete()
    .eq("id",postId).eq("user_id",currentUser.id);
  if (error) return notify("Delete failed: " + error.message,true);

  /* Remove the matching uploaded file from this user's folder, if possible. */
  try {
    const parsed = new URL(post.media_url);
    const marker = `/object/public/${BUCKET}/`;
    const index = parsed.pathname.indexOf(marker);
    if (index >= 0) {
      const path = decodeURIComponent(parsed.pathname.slice(index + marker.length));
      if (path.startsWith(currentUser.id + "/")) {
        await db.storage.from(BUCKET).remove([path]);
      }
    }
  } catch (_) {}

  await loadFeed();
  notify("Post deleted.");
}

db.auth.onAuthStateChange((_event,session) => {
  currentUser = session?.user || null;
  syncUI();
  setTimeout(() => loadFeed(),0);
});

(async function init() {
  const {data} = await db.auth.getSession();
  currentUser = data.session?.user || null;
  syncUI();
  await loadFeed();
})();
</script>
</body>
</html>
